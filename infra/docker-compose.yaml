name: rag-agent-backend

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: rag-agent-backend:${RAG_AGENT_IMAGE_TAG:-local}
    command: ["rag-agent-api"]
    restart: unless-stopped
    init: true
    env_file:
      - ${RAG_AGENT_ENV_FILE:-../.env}
    environment:
      # Container networking: Milvus over the compose network, Ollama on the
      # host. These override any host-oriented values in the env file.
      RAG_AGENT_PORT: "9229"
      MILVUS_URI: http://milvus:19530
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "${RAG_AGENT_HTTP_BIND:-127.0.0.1}:${RAG_AGENT_HTTP_PORT:-9229}:9229"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      milvus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9229/health', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    command: minio server /minio_data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.6.6
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Published on loopback so a host-run API (uv run rag-agent-api) can reach it.
      - "127.0.0.1:19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30

volumes:
  etcd_data:
  minio_data:
  milvus_data:

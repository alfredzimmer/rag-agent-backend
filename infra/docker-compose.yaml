name: edemi-backend

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: edemi-backend:${EDEMI_IMAGE_TAG:-local}
    command: ["edemi-api"]
    restart: unless-stopped
    init: true
    env_file:
      - ${EDEMI_ENV_FILE:-../.env}
    environment:
      EDEMI_PORT: "9229"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      INGESTION_UPLOAD_DIR: /app/.runtime/uploads
      PG_URI: ${PG_URI:-postgresql://edemi:edemi@postgres:5432/edemi}
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      OLLAMA_HOST: http://host.docker.internal:11434
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${EDEMI_HTTP_BIND:-127.0.0.1}:${EDEMI_HTTP_PORT:-9229}:9229"
    volumes:
      - ingestion_uploads:/app/.runtime/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    stop_grace_period: 2m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9229/health', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  ingestion-worker:
    image: edemi-backend:${EDEMI_IMAGE_TAG:-local}
    command: ["edemi-ingestion-worker"]
    restart: unless-stopped
    init: true
    env_file:
      - ${EDEMI_ENV_FILE:-../.env}
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      INGESTION_UPLOAD_DIR: /app/.runtime/uploads
      PG_URI: ${PG_URI:-postgresql://edemi:edemi@postgres:5432/edemi}
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      OLLAMA_HOST: http://host.docker.internal:11434
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ingestion_uploads:/app/.runtime/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    stop_grace_period: 5m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from pathlib import Path; assert any('edemi-ingestion-worker' in path.read_text(errors='ignore') for path in Path('/proc').glob('[0-9]*/cmdline') if path.parent.name != str(os.getpid()))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  redis:
    image: redis:8.2.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edemi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edemi}
      POSTGRES_DB: ${POSTGRES_DB:-edemi}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    command: minio server /minio_data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.6.6
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus

  attu:
    image: zilliz/attu:latest
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      - milvus
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "127.0.0.1:3030:3000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  tempo:
    image: grafana/tempo:2.10.7
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  loki:
    image: grafana/loki:3.7.2
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:13.0.2
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  ingestion_uploads:
  redis_data:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:

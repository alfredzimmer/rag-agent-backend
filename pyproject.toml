[project]
name = "rag-agent-backend"
version = "0.1.0"
description = "Minimal RAG agent: FastAPI + Milvus retrieval + Ollama generation."
readme = "readme.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "langchain-milvus",
    "langchain-ollama",
    "pymilvus",
    "python-dotenv",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pyyaml",
]
ui = [
    "requests",
    "streamlit",
]

[project.scripts]
rag-agent-api = "rag_agent_server.main:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent_server", "src/rag"]

[tool.hatch.build.targets.sdist]
include = [
    "/pyproject.toml",
    "/readme.md",
    "/infra",
    "/src/rag_agent_server",
    "/src/rag",
    "/tests",
]

[tool.uv]
package = true
